name: ci
on: [push, pull_request]
permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 \
            detect --source=/repo --redact --verbose --exit-code 1

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: syntax-check every app file as an ES module
        run: for f in www/*.js; do node --input-type=module --check < "$f" || { echo "syntax error in $f"; exit 1; }; done
      - run: node test/stepcore.test.mjs
