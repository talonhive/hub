name: android
# Debug test APK on every relevant push (Java + Android SDK are preinstalled on ubuntu runners).
# Download: the run's "Artifacts" section. Signed public builds come from release.yml (version tags).
on:
  push:
    branches: [main]
    paths: ["www/**", "test/**", "package.json", "capacitor.config.json", "android-res/**", "tools/android-prepare.sh", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: tests first (never package a broken step detector)
        run: |
          for f in www/*.js; do node --input-type=module --check < "$f"; done
          node test/stepcore.test.mjs && node test/native-steps.test.mjs && node test/mining.test.mjs
      - name: prepare the Android project
        run: bash tools/android-prepare.sh
      - name: build debug APK
        run: cd android && ./gradlew --no-daemon assembleDebug
      - name: name it and record its checksum
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/talonhive-hub-${GITHUB_SHA::7}-debug.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: talonhive-hub-debug-apk
          path: dist/
          retention-days: 14
